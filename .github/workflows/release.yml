name: 'Release supply-chain-aotcache'

on:
  workflow_dispatch:

jobs:
  release:
    name: 'Build and release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64

      - name: 'Install toolchain and dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade apt
          sudo apt-get install gcc-10 g++-10 libxrandr-dev libxtst-dev libcups2-dev libasound2-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100 --slave /usr/bin/g++ g++ /usr/bin/g++-10

      - name: 'Configure'
        run: >
          bash configure
          --with-conf-name=linux-x86_64-server-release
          --with-version-opt=${GITHUB_ACTOR}-${GITHUB_SHA}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-zlib=system
          --with-jmod-compress=zip-1
          || (echo "Dumping config.log:" && cat config.log && exit 1)

      - name: 'Build'
        uses: ./.github/actions/do-build
        with:
          make-target: 'images'
          platform: linux-x86_64-server-release

      - name: 'Package'
        id: package
        run: |
          COMMIT=$(git rev-parse HEAD)
          ARCHIVE="jdk-supply-chain-aotcache-${COMMIT}.tar.gz"
          tar -czf "$ARCHIVE" -C build/linux-x86_64-server-release/images jdk
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT

      - name: 'Create release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=${{ steps.package.outputs.commit }}
          ARCHIVE=${{ steps.package.outputs.archive }}
          NOTES=$(git log --oneline supply-chain-aotcache..HEAD)
          gh release create "jdk-supply-chain-aotcache-${COMMIT}" \
            --title "Custom JDK: supply-chain-aotcache (${COMMIT})" \
            --notes "${NOTES}" \
            "${ARCHIVE}"